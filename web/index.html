    </div>` : '');

  $('result').innerHTML =
    `<div class="page" id="pageOverview">${overview}</div>` +
    (SHOW_PICKS ? `<div class="page" id="pagePicks" hidden><div class="card" id="picksCard"></div></div>` : '') +
    (SHOW_COMPARE ? `<div class="page" id="pageCompare" hidden><div class="card" id="compareCard"></div></div>` : '');
  $('result').classList.add('on');
  bindLegendSort();
  buildTabs(); // 重建页签：数据变了，区块可能出现/消失
  /* 同一个玩家重新查询时缓存已存在 → 常用传奇页立刻就有内容；
     否则先给骨架，等对局数据回来再填（loadMatches 统一分发） */
  if (SHOW_PICKS) renderPicks(perMatch(matchCache.get(qKey(lastQuery ?? {}))));
  /* 自动带上对局数据：走势图 / 对局记录 / 常用传奇都靠它，先占位再异步填充，
     不改变当前页签高亮，也不抢滚动位置 —— 不会拖慢主战绩的显示 */
  if (NEED_MATCHES()) loadMatches({ auto: true });
}

/* 排序：直接重排已有节点，比重新渲染省事，也不会重新下载图片 */
function bindLegendSort() {
  const grid = $('legendGrid');
  if (!grid) return;
  document.querySelectorAll('#legendCard .tbtn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#legendCard .tbtn').forEach((b) => b.classList.toggle('on', b === btn));
      const byName = btn.dataset.sort === 'name';
      [...grid.children]
        .sort((a, b) => {
          if (!byName) {
            const d = Number(b.dataset.v) - Number(a.dataset.v);
            if (d !== 0) return d;
          }
          return a.dataset.n.localeCompare(b.dataset.n, 'zh');
        })
        .forEach((c) => grid.appendChild(c));
    });
  });
}

/* 前端请求超时：与服务端的硬超时（默认 60s）匹配，略宽一点。
   目的：ALS/TRN 不通时不要让界面无限转圈 —— 给明确报错，用户才知道该重试。 */
const FETCH_TIMEOUT_MS = 75_000;

const fetchJson = async (url, body) => {
  try {
    return await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: AbortSignal.timeout(FETCH_TIMEOUT_MS),
    });
  } catch (e) {
    if (e?.name === 'TimeoutError') {
      throw new Error(`请求超时（超过 ${Math.round(FETCH_TIMEOUT_MS / 1000)} 秒）。` +
        '通常是网络不通或上游站被限流，稍后重试即可。');
    }
    throw e;
  }
};

/* ══════════ 对局数据 ══════════
   一次抓取同时供「最近表现（走势图）」「对局记录」「常用传奇」使用。
   数据分两份，**粒度不同，不能混用**：
     · als —— ALS 的**逐场**明细（击杀/伤害/地图/时长/逐场 RP），但滞后
     · trn —— TRN 的**会话聚合**（一次连续游戏的合计），但更新
       ⚠️ 会话的 kills/damage 是「该时段合计」，不是单场；没有地图与时长。
          所以走势图与「常用传奇」只用 als；只有对局记录会把两者一起列出（分开标注）。
   结果按查询条件缓存；点「对局记录」页签只是滚过去看，已加载就用缓存。 */
/* 前端**只展示最近 10 场**（ALS 侧）。
   后端保留了拉取「全部历史」的能力（CLI：`node track.mjs --matches all`，
   实测本账号 2484 场 / 6 个赛季），只是目前没有数据库可存，所以不做全量展示。 */
const MATCH_LIMIT = 10;
/* 保留：全量拉取的入参值（后端 server.mjs 已支持透传 'all'） */
const MATCH_LIMIT_ALL = 'all';
let lastQuery = null;               // 最近一次成功的查询条件
/* 后端按**当前系统日期**算出的赛季信息（含与 tracker.gg 的一致性校验）。
   它不属于对局缓存（是查询级的元数据），所以单独存。
   结构：{ season, name, start, split, trackerSays, consistent, stale, at } */
let curSeasonInfo = null;
const matchCache = new Map();        // 查询条件 → { als: [...], trn: [...] }
const matchInflight = new Set();     // 正在请求中的查询条件（防重复发请求）

const qKey = (q) => `${q.uid || ''}|${q.name || ''}|${q.platform}`;

/* unix 秒 → "09-12 21:30"（本地时区）；拿不到真实时间戳就退回 ALS 的相对文案 */
function whenText(m) {
  if (!m?.timestamp) return m?.when ?? '';
  const d = new Date(m.timestamp * 1000);
  const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* unix 秒 → "09/12 04:15"（短绝对时间，与相对时间并列显示用） */
function absShort(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* 行首的时间标签：相对时间（亮）+ 绝对日期（暗）。
   两者并列是刻意的 —— 用户问过「当天还是几天前」，单看相对时间不够确定。 */
function whenLabel(ts, extra) {
  const rel = relTime(ts);
  const abs = absShort(ts);
  const full = ts ? new Date(ts * 1000).toLocaleString('zh-CN') : '';
  if (!rel && !abs) return '';
  return `<div class="when"${full ? ` title="${esc(full)}"` : ''}>${
    rel ? `<b>${esc(rel)}</b>` : ''}${
    abs ? `<span>${esc(abs)}</span>` : ''}${
    extra ? `<span>${esc(extra)}</span>` : ''}</div>`;
}

/* unix 秒 → 相对时间（"2 天前"），对齐 tracker.gg 的 "2 days ago"。
   ⚠️ 数据里**没有**这个字段（tracker.gg 也是前端算的），必须自己算。
   它是相对**当前时刻**动态计算的：同一份缓存数据放久了，就会从「2 天前」变成「2 周前」，
   这是正确行为（数据确实旧了）。绝对时间放 title 里备查。

   日级用**日历天**而不是 24 小时差值 —— 「今天/昨天」是用户真正的心理模型，
   按 24h 差会出现「23 小时前」其实是昨天、或「25 小时前」其实只隔了一晚的困惑。 */
function relTime(ts) {
  if (!ts) return '';
  const now = Date.now();
  const diff = Math.floor(now / 1000) - ts;
  // 未来时间（客户端时钟偏差 / 服务端时间不准）统一显示「刚刚」，避免「−1 天前」
  if (diff < 60) return '刚刚';
  if (diff < 3600) return `${Math.floor(diff / 60)} 分钟前`;

  const d = new Date(ts * 1000);
  const today = new Date(now);
  const dayOf = (x) => Math.floor(new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime() / 86400000);
  const dayDiff = dayOf(today) - dayOf(d);

  if (dayDiff <= 0) return `${Math.floor(diff / 3600)} 小时前`; // 同一天
  if (dayDiff === 1) return '昨天';
  if (dayDiff < 7) return `${dayDiff} 天前`;
  if (dayDiff < 30) return `${Math.floor(dayDiff / 7)} 周前`;
  if (dayDiff < 365) return `${Math.floor(dayDiff / 30)} 个月前`;
  return `${Math.floor(dayDiff / 365)} 年前`;
}

/* 赛季 "s29_s2" → "S29 · 第 2 段" */
function splitLabel(s) {
  const m = /^s(\d+)_s(\d+)$/.exec(String(s ?? ''));
  return m ? `S${m[1]} · 第 ${m[2]} 段` : String(s ?? '—');
}

/* 对局的 stats 是任意键值对，优先取「击杀 / 伤害」，取不到再退回前两项。
   注意必须精确匹配 Kills —— 否则 "Career Kills" 会被当成本场击杀 */
function matchStats(s) {
  const o = s ?? {};
  const keys = Object.keys(o);
  const pick = (exact, re) => keys.find((k) => k === exact) ?? keys.find((k) => re.test(k));
  const out = [];
  const kk = pick('Kills', /^Kills$/i), kd = pick('Damage', /Damage/i);
  if (kk) out.push(['击杀', o[kk]]);
  if (kd) out.push(['伤害', o[kd]]);
  if (!out.length) keys.slice(0, 2).forEach((k) => out.push([k, o[k]]));
  return out;
}

/* 统计键 → 中文标签。
   **只翻译含义明确的通用项**；传奇专属追踪器（如 "Tempest: Damage"、"Bamboozles"）
   是游戏内的技能/道具名，没有统一权威译名，硬译容易错，所以**保留英文原文**。 */
const STAT_CN = {
  Kills: '击杀',
  Damage: '伤害',
  Revives: '复活',
  Headshots: '爆头',
  Wins: '胜场',
  'Career Kills': '生涯击杀',
};
const statCN = (k) => STAT_CN[k] ?? k;

/* 对局行第二行：把该场**所有可用数据平铺**出来。
   第一行只留头条数字（击杀 / 伤害）；这里放等级、XP、其余追踪器数值，
   末尾再列出**该场记录到的追踪器组合原文**（= stats 的键），
   这样「为什么第一行是击杀/伤害」一眼能对上，也方便和游戏内对照。 */
function matchExtra(m) {
  const s = m.stats ?? {};
  const keys = Object.keys(s);
  const items = [];
  if (m.level != null) items.push(['等级', fmt(m.level)]);
  if (m.xp != null) items.push(['XP', fmt(m.xp)]);
  for (const k of keys) {
    if (k === 'Kills' || k === 'Damage') continue; // 第一行已有，不重复列值
    const v = s[k];
    if (v == null || v === '') continue;
    items.push([statCN(k), String(v)]);
  }

  const chip = ([k, v]) =>
    `<span class="ex"><span class="k" title="${esc(k)}">${esc(k)}</span><b>${esc(v)}</b></span>`;

  const combo = keys.length
    ? `<span class="trk"><span class="lh">追踪器</span>` +
      `<span class="cn">${keys.map(esc).join(' · ')}</span></span>`
    : '';

  return `<div class="extra">${items.map(chip).join('')}${combo}</div>`;
}

const matchHead = (sub) => `<h2><span class="ico"></span><span class="code">Matches</span>对局记录<span class="sub">${esc(sub)}</span></h2>`;

/* ══════════ 最近表现：RP 走势 ══════════ */

const trendHead = (sub) => `<h2><span class="ico"></span><span class="code">Trend</span>最近表现<span class="sub">${esc(sub)}</span></h2>`;

/* 走势图的赛季选择：
   · trendSeason        —— 当前选中（null = 全部），默认由 renderTrend 设为最新赛季
   · trendSeasonTouched —— 用户是否手动点过；没点过则跟着最新赛季走
     （换玩家/重新查询后不会把用户的选择弄丢，也不会停在已不存在的赛季） */
let trendSeason = null;
let trendSeasonTouched = false;

/* 只保留有真实 RP + 时间戳的场次，并按时间正序（旧 → 新）。
   对局列表本身是「新 → 旧」，直接画会把走势整个画反。
   RP 是「这一场打完之后」的分数，所以正序排列后天然就是段位走势。
   带上 season 用作图上分段（赛季由后端按时间戳推导）。 */
function trendPoints(list) {
  return list
    .filter((m) => m.rp != null && m.timestamp != null)
    .map((m) => ({ rp: m.rp, ts: m.timestamp, season: m.season ?? null, name: m.seasonName ?? null }))
    .sort((a, b) => a.ts - b.ts);
}

const shortDay = (ts) => {
  const d = new Date(ts * 1000);
  const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}/${p(d.getDate())}`;
};

/* Y 轴刻度用 k 缩写（12,390 → 12.4k）：viewBox 单位里 padL 只有 60，
   字号放大后六位数字会顶出左边界被 SVG 裁掉 */
const shortRp = (v) => (v >= 10000 ? `${(v / 1000).toFixed(1).replace(/\.0$/, '')}k` : fmt(v));

/* 手写 SVG 折线图（项目约定：零外部依赖，不引任何图表库）。
   注意 SVG 会按 viewBox 等比缩放，所以字号/线宽在窄屏要 media query 补大。
   opts.segments=false 时不画赛季分界线（只看单赛季时它们是多余的）。 */
function trendSvg(pts, opts = {}) {
  const drawSeg = opts.segments !== false;
  const W = 760, H = 200;
  const padL = 60, padR = 14, padT = 16, padB = 28;
  const iw = W - padL - padR, ih = H - padT - padB;
  const n = pts.length;

  const vals = pts.map((p) => p.rp);
  const vLo = Math.min(...vals), vHi = Math.max(...vals);
  /* 值域往往很窄（一晚上就 ±500），从 min 起画会贴着边框 —— 留 16% 呼吸空间 */
  const span = Math.max(vHi - vLo, 100);
  const yLo = vLo - span * 0.16, yHi = vHi + span * 0.16;

  const X = (i) => padL + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);
  const Y = (v) => padT + (1 - (v - yLo) / (yHi - yLo)) * ih;
  const yBot = padT + ih;

  /* 颜色跟着整段走势的涨跌走：涨 = 青绿收尾蓝，跌 = 红 */
  const net = vals.at(-1) - vals[0];
  const up = net >= 0;
  /* 涨 = 琥珀→钢青，跌 = 琥珀→余烬（和全站三个功能色保持一致） */
  const cIn = up ? '#5ed0d8' : '#ff5a37';
  const cOut = '#ff9f28';

  const line = pts.map((p, i) => `${X(i).toFixed(1)},${Y(p.rp).toFixed(1)}`).join(' ');
  const area = `${X(0).toFixed(1)},${yBot.toFixed(1)} ${line} ${X(n - 1).toFixed(1)},${yBot.toFixed(1)}`;
  /* 网格标签用真实值（不是加了 padding 的边界），读出来才是实际 RP */
  const ticks = [vHi, (vHi + vLo) / 2, vLo];
  /* 高亮点只画首尾和区间极值，其余靠透明热区给原生 tooltip，避免一片密密麻麻 */
  const marks = new Set([0, n - 1, vals.indexOf(vHi), vals.indexOf(vLo)]);

  /* ── 赛季分段 ──
     找出赛季切换的位置（相邻两点的 season 不同），在中间画一条竖虚线 + 顶部标签。
     这样一眼能看出「哪段是哪个赛季」，而不是一条看不出归属的曲线。 */
  const bounds = [];
  if (drawSeg) {
    for (let i = 1; i < n; i++) {
      if (pts[i].season != null && pts[i - 1].season != null && pts[i].season !== pts[i - 1].season) {
        bounds.push(i);
      }
    }
  }
  /* 每个赛季的区段（用于顶部标签的居中定位） */
  const segs = [];
  let from = 0;
  for (const b of [...bounds, n]) {
    segs.push({ from, to: b - 1, season: pts[from].season, name: pts[from].name });
    from = b;
  }
  /* 区段标签：只有**真的跨赛季**（≥2 段）才标。
     单赛季时标题里已有赛季名，图里再标一次是重复信息。 */
  const useSegLabels = drawSeg && bounds.length > 0;
  const segDividers = bounds.map((i) => {
    // 分界线取两侧点的中点，落在两场之间更自然
    const x = (X(i - 1) + X(i)) / 2;
    return `<line class="seg" x1="${x.toFixed(1)}" y1="${padT - 4}" x2="${x.toFixed(1)}" y2="${yBot}"/>`;
  }).join('');
  /* 顶部赛季标签：只在跨赛季时标，且区段要够宽，否则会叠在一起 */
  const segLabels = !useSegLabels ? '' : segs.map((s) => {
    const x0 = X(s.from), x1 = X(s.to);
    if (x1 - x0 < 44 || s.season == null) return '';
    const cx = (x0 + x1) / 2;
    return `<text class="seg-lab" x="${cx.toFixed(1)}" y="${padT - 10}" text-anchor="middle">S${s.season}</text>`;
  }).join('');

  return `<svg class="trend" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="最近 ${n} 场 RP 走势，区间 ${fmt(vLo)} 至 ${fmt(vHi)}">
    <defs>
      <linearGradient id="tLine" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="${cOut}"/><stop offset="1" stop-color="${cIn}"/>
      </linearGradient>
      <linearGradient id="tFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${cIn}" stop-opacity=".20"/>
        <stop offset="1" stop-color="${cIn}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${ticks.map((v) => `<line class="grid" x1="${padL}" y1="${Y(v).toFixed(1)}"
        x2="${W - padR}" y2="${Y(v).toFixed(1)}"/>`).join('')}
    ${ticks.map((v) => `<text class="axis y-lab" x="${padL - 9}" y="${(Y(v) + 4).toFixed(1)}"
        text-anchor="end">${shortRp(v)}</text>`).join('')}
    ${segDividers}
    ${segLabels}
    <polygon points="${area}" fill="url(#tFill)"/>
    <polyline class="line" points="${line}" stroke="url(#tLine)"/>
    ${pts.map((p, i) => (marks.has(i)
      ? `<circle class="dot" cx="${X(i).toFixed(1)}" cy="${Y(p.rp).toFixed(1)}" r="3.4" fill="${cIn}"/>`
      : '')).join('')}
    ${pts.map((p, i) => `<circle class="hit" cx="${X(i).toFixed(1)}" cy="${Y(p.rp).toFixed(1)}" r="10">
        <title>${esc(`${shortDay(p.ts)} · ${fmt(p.rp)} RP${p.season ? ` · S${p.season}` : ''}`)}</title></circle>`).join('')}
    <text class="axis axis-x" x="${padL}" y="${H - 8}" text-anchor="start">${shortDay(pts[0].ts)}</text>
    <text class="axis axis-x" x="${W - padR}" y="${H - 8}" text-anchor="end">${shortDay(pts.at(-1).ts)}</text>
  </svg>`;
}

const fmtSigned = (v) => (v > 0 ? `+${fmt(v)}` : fmt(v));
const trendCls = (v) => (v > 0 ? 'up' : v < 0 ? 'dn' : '');

function trendFoot(list) {
  const chg = list.map((m) => m.rpChange).filter((v) => v != null);
  const net = chg.reduce((a, b) => a + b, 0);
  const avg = chg.length ? Math.round(net / chg.length) : 0;
  const cell = (k, v, c = '') => `<div><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`;
  return `<div class="trend-foot">
    ${cell('净 RP', fmtSigned(net), trendCls(net))}
    ${cell('场均', fmtSigned(avg), trendCls(avg))}
    ${cell('最好一场', chg.length ? fmtSigned(Math.max(...chg)) : '—', trendCls(Math.max(...chg)))}
    ${cell('最差一场', chg.length ? fmtSigned(Math.min(...chg)) : '—', trendCls(Math.min(...chg)))}
  </div>`;
}

/* 按赛季拆分的统计。
   ⚠️ 净 RP 必须用 **`rpChange` 累加**，不能用「曲线首尾差值」——
   首尾差值会被脏数据与时间断档影响（实测两者能差好几千），
   而且要和「对局记录」页的赛季分组口径保持一致。 */
function trendSeasonStats(list) {
  const by = new Map();
  for (const m of list) {
    if (m.season == null) continue;
    let g = by.get(m.season);
    if (!g) {
      by.set(m.season, (g = { season: m.season, name: m.seasonName ?? null, pts: 0, net: 0 }));
    }
    g.pts++;
    g.net += m.rpChange ?? 0;
  }
  return [...by.values()].sort((a, b) => a.season - b.season);
}

function renderTrend(list) {
  if (!SHOW_TREND) return;
  const card = $('trendCard');
  if (!card) return;

  /* 赛季拆分用**全量 list**（不限于有 RP 的 pts），与对局记录口径一致 */
  const ss = trendSeasonStats(list);
  const allSeasons = ss.map((s) => s.season).sort((a, b) => b - a); // 新 → 旧
  const latest = allSeasons[0] ?? null;

  /* ⚠️ **默认只看最新赛季**：跨 5 个赛季画一条曲线，值域从 3.5k 拉到 12.7k，
     每个赛季的起伏会被压成一条平线，看不出节奏 —— 这也是用户要求「选赛季」的原因。
     两个变量分工：
       · `trendSeason` —— 当前选中的赛季（null = 全部）
       · `trendSeasonTouched` —— 用户是否手动点过，没点过时跟随最新赛季 */
  if (!trendSeasonTouched && trendSeason !== latest) trendSeason = latest;

  const listForTrend = trendSeason == null ? list : list.filter((m) => m.season === trendSeason);
  const pts = trendPoints(listForTrend);
  const activeName = ss.find((s) => s.season === trendSeason)?.name ?? null;

  /* 赛季选择按钮（只在有多个赛季时出现） */
  const picker = allSeasons.length > 1 ? `<div class="trend-picker">
    <span class="lb">赛季</span>
    <button class="tbtn${trendSeason == null ? ' on' : ''}" data-tseason="all">全部</button>
    ${allSeasons.map((s) => `<button class="tbtn${trendSeason === s ? ' on' : ''}"
      data-tseason="${s}" title="只看 S${s}">S${s}</button>`).join('')}
    <span class="hint">默认最新赛季</span>
  </div>` : '';

  const sub = pts.length
    ? (trendSeason == null
        ? `全部 ${ss.length} 个赛季 · ${pts.length} 场`
        : `S${trendSeason}${activeName ? ` · ${activeName}` : ''} · ${pts.length} 场`)
    : '—';

  if (pts.length < 2) {
    card.innerHTML = `${trendHead(sub)}${picker}
      <div class="note">${trendSeason == null ? '这段时间' : `S${trendSeason}`}的对局里
        没有足够的 RP 记录（需 ≥2 场），画不出走势。${
        allSeasons.length > 1 ? '<br>试试切到别的赛季，或点「全部」。' : ''}</div>`;
    bindTrendPicker();
    return;
  }

  /* 只有看「全部」且真的跨赛季时才需要图例与分段线；单赛季下它们是多余的 */
  const showSeg = trendSeason == null && ss.length > 1;
  const legend = showSeg
    ? `<div class="trend-legend">${ss.map((s) => `<span class="lgd">
        <b>S${s.season}</b>${s.name ? ` ${esc(s.name)}` : ''}
        <i>${s.pts} 场</i>
        <em class="${trendCls(s.net)}">${fmtSigned(s.net)}</em>
      </span>`).join('')}</div>`
    : '';

  card.innerHTML = `${trendHead(sub)}${picker}${trendSvg(pts, { segments: showSeg })}${legend}${trendFoot(listForTrend)}`;
  bindTrendPicker();
}

/* 赛季按钮：只重渲染走势图，不重新请求 */
function bindTrendPicker() {
  document.querySelectorAll('#trendCard .trend-picker [data-tseason]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const v = btn.dataset.tseason;
      trendSeason = v === 'all' ? null : Number(v);
      trendSeasonTouched = true;
      const pack = matchCache.get(qKey(lastQuery ?? {}));
      if (pack) renderTrend(perMatch(pack));
    });
  });
}

/* ══════════ 常用传奇（独立页面） ══════════
   完全复用「对局数据」那一份缓存，不额外发任何请求。
   它不在第一页出现 —— 挂在 #pagePicks 里，点「常用传奇」页签才显示。 */

const picksHead = (sub) => `<h2><span class="ico"></span><span class="code">Picks</span>常用传奇<span class="sub">${esc(sub)}</span></h2>`;

/** 切页：Overview / 常用传奇 / 数据对比 三个独立页面 */
function showPage(name) {
  const ov = $('pageOverview'), pk = $('pagePicks'), cp = $('pageCompare');
  if (ov) ov.hidden = name !== 'overview';
  if (pk) pk.hidden = name !== 'picks';
  if (cp) cp.hidden = name !== 'compare';
}

/* ══════════ 数据对比（ALS vs TRN，独立页面） ══════════
   目的：两个源各有短长，且**对局历史的新旧差别很大**（实测 ALS 比 TRN 旧约 2 个月）。
   这里把可核对的事实摆出来 —— 新鲜度、交叉验证、能力矩阵 —— 再给结论。
   走 `provider: 'both'`：ALS 聚合 + TRN 会话 + 服务端算好的 compare 对象。
   TRN 限流 10 次/分钟，所以只在本页签被点开时才请求。 */

const COMPARE_HEAD = (sub) => `<h2><span class="ico"></span><span class="code">Compare</span>数据对比<span class="sub">${esc(sub)}</span></h2>`;

/* 数据来源的中文说明 */
const TRN_SRC = { page: '网页直抓', api: '官方 API', browser: '浏览器采集' };

/* 给用户自己用的采集脚本：
   在 tracker.gg 的 matches 页按 F12 打开控制台粘贴运行。
   为什么必须在浏览器里跑：tracker.gg 由 Cloudflare 防护，
   服务端请求一律 403（实测挑战页），只有过了挑战的真实浏览器能拿到数据。

   **同时采集两份数据**（都在页面的 __INITIAL_STATE__ 里）：
     · standardSessions[0].items —— 对局会话（对局记录用）
     · standardProfiles[0]       —— 账号聚合 + 传奇分段（等级/RP/段位/传奇用）
   有了 profiles，本项目的全部数据来源都只需 tracker.gg，不再依赖 ALS。 */
function collectSnippet() {
  const origin = location.origin || 'http://127.0.0.1:8787';
  return `(async()=>{const S=window.__INITIAL_STATE__?.stats;
const items=S?.standardSessions?.[0]?.items, profile=S?.standardProfiles?.[0];
if(!items?.length)return console.error('本页未找到对局数据，请确认已打开 /matches 页面');
const p=location.pathname.split('/');
const r=await fetch('${origin}/api/ingest/trn',{method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({player:p[4],platform:p[3],sourceUrl:location.href,
    data:{items,profile}})});
console.log('已发送',items.length,'个会话'+(profile?' + 账号档案':'（无 profile）'),'→',await r.json());})()`;
}

/* unix 秒 → "07-19 03:21" */
function tsText(ts) {
  if (!ts) return '—';
  const d = new Date(ts * 1000);
  const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

const cell = (v, unit = '') => (v == null ? '<span class="na">—</span>' : `${fmt(v)}${unit}`);

function renderCompare(cmp) {
  if (!SHOW_COMPARE) return;
  const card = $('compareCard');
  if (!card) return;

  if (!cmp) {
    card.innerHTML = `${COMPARE_HEAD('—')}
      <div class="note" style="text-align:left;padding:2px 0 14px">没有拿到对比数据。</div>`;
    return;
  }

  const f = cmp.freshness ?? {};
  const v = cmp.verdict ?? {};
  const hasTrn = f.trn != null;

  /* 新鲜度：两个源并排，直观看出差多少 */
  const fresh = `<div class="fresh">
    <div class="fbox">
      <div class="fk"><span class="src als">ALS</span>最新一场</div>
      <div class="fd">${esc(tsText(f.als))}</div>
      <div class="fl">英雄 <b>${esc(legendCN(f.alsNewestLegend) ?? '—')}</b></div>
    </div>
    <div class="fbox trn">
      <div class="fk"><span class="src trn">TRN</span>最新会话${cmp.trnSource ? ` · ${esc(TRN_SRC[cmp.trnSource] ?? cmp.trnSource)}` : ''}</div>
      <div class="fd">${esc(tsText(f.trn))}</div>
      <div class="fl">英雄 <b>${esc(legendCN(f.trnNewestLegend) ?? '—')}</b>
        ${cmp.trnCollectedAt ? `<br>采集于 ${esc(tsText(Date.parse(cmp.trnCollectedAt) / 1000))}` : ''}</div>
    </div>
  </div>
  ${f.gapDays != null && f.gapDays > 0
    ? `<div class="gap-note">两源相差约 ${f.gapDays} 天 —— 这就是「本地显示一个英雄、tracker.gg 显示另一个」的原因</div>`
    : ''}`;

  /* 交叉验证：口径对齐后逐项比对 */
  const ccRows = (cmp.crossCheck ?? []).map((c) => `<tr>
    <td>${esc(c.field)}${c.note ? `<div class="note">${esc(c.note)}</div>` : ''}</td>
    <td class="num">${cell(c.als, c.unit === 'RP' ? ' RP' : '')}</td>
    <td class="num">${cell(c.trn, c.unit === 'RP' ? ' RP' : '')}</td>
    <td>${c.als == null || c.trn == null ? '<span class="na">缺数据</span>'
      : c.same ? '<span class="same">一致 ✓</span>' : '<span class="diff">不一致 ✗</span>'}</td>
  </tr>`).join('');

  /* 能力矩阵：说明为什么不能简单合并两个源 */
  const capRows = (cmp.capabilities ?? []).map((c) => `<tr>
    <td>${esc(c.item)}</td>
    <td>${c.als ? '<span class="yes">有</span>' : '<span class="no">无</span>'}</td>
    <td>${c.trn ? '<span class="yes">有</span>' : '<span class="no">无</span>'}</td>
    <td></td>
  </tr>`).join('');

  const cov = cmp.coverage ?? {};
  card.innerHTML = `${COMPARE_HEAD('ALS vs TRN')}
    <div class="verdict ${esc(v.level ?? '')}">${esc(v.text ?? '')}</div>
    ${cmp.trnError ? `<div class="note" style="text-align:left;padding:0 0 16px">
      TRN 数据获取失败：<code>${esc(cmp.trnError)}</code><br>
      数据来自抓取 <code>apex.tracker.gg</code> 页面（页面已把数据嵌在 HTML 里，<b>不需要 API Key</b>）。
      若失败通常是网络不通或被 Cloudflare 拦了验证页，稍后重试即可。
      （可选：配了 <code>TRN_API_KEY</code> 就会改用官方 API，作为备选。）</div>` : ''}
    ${fresh}
    <h3 class="sub-h">交叉验证</h3>
    <table class="ctab">
      <thead><tr><th>字段</th><th>ALS</th><th>TRN</th><th>结论</th></tr></thead>
      <tbody>${ccRows || '<tr><td colspan="4" class="na">无可比字段</td></tr>'}</tbody>
    </table>
    <h3 class="sub-h">数据能力对比</h3>
    <table class="ctab">
      <thead><tr><th>能力</th><th>ALS</th><th>TRN</th><th></th></tr></thead>
      <tbody>${capRows}</tbody>
    </table>
    <h3 class="sub-h">覆盖度</h3>
    <div class="pick-sum">
      <div><div class="k">ALS 对局数</div><div class="v">${cov.alsMatchCount ?? 0}<small>逐场</small></div></div>
      <div><div class="k">TRN 会话数</div><div class="v">${cov.trnSessionCount ?? 0}<small>会话</small></div></div>
      <div><div class="k">ALS 粒度</div><div class="v">逐场</div></div>
      <div><div class="k">TRN 粒度</div><div class="v">会话聚合</div></div>
    </div>
    <div class="note" style="text-align:left;padding:14px 0 0">
      说明：TRN 数据直接<b>抓网页</b>获得（tracker.gg 是 Vue 服务端渲染，
      首屏数据以 <code>window.__INITIAL_STATE__</code> 嵌在 HTML 里），
      <b>无需 API Key</b>；站点限额 20 次/分钟，已内置限速，一次查询只发 1 个请求。<br>
      但它的 <code>/sessions</code> 只提供<b>会话级聚合</b>（一次连续游戏的合计），
      <code>duration</code> 恒为默认值不可信用，也没有地图与逐场 RP 变化。
      所以「混合」的做法是：
      <b>聚合数据与逐场明细用 ALS，更新近的对局用 TRN 补</b>，而不是用 TRN 取代 ALS。
      ${!hasTrn ? '<br>当前未取到 TRN 数据，上述 TRN 列为空。' : ''}
    </div>
    <h3 class="sub-h">怎么更新 TRN 数据（无需 Key）</h3>
    <div class="note" style="text-align:left;padding:0 0 10px">
      tracker.gg 有 Cloudflare 防护，<b>服务端直接抓会被 403 拦下</b>（实测挑战页），
      所以改用你的浏览器采集 —— 浏览器能过挑战，把页面里已渲染好的数据发回本地服务：
      <ol style="margin:8px 0 0;padding-left:20px">
        <li>新开一个标签页，访问 <code>apex.tracker.gg/apex/profile/origin/&lt;你的ID&gt;/matches</code></li>
        <li>按 <b>F12</b> 打开控制台，把下面这段粘进去回车</li>
        <li>回到本页刷新（或重开「数据对比」页签）就能看到数据</li>
      </ol>
    </div>
    <div class="snippet">
      <pre id="collectCode">${esc(collectSnippet())}</pre>
      <button class="tbtn" id="copySnippet">复制</button>
    </div>
    <div class="note" style="text-align:left;padding:10px 0 0">
      站点限额 <b>20 次/分钟</b>，每次采集只发 1 个请求，远低于限额。
      数据落盘在 <code>data/trn-sessions.json</code>。
      （可选：配了 <code>TRN_API_KEY</code> 会自动改用官方 API，作为备选；不配也完全可用。）
    </div>`;

  const btn = $('copySnippet');
  if (btn) {
    btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(collectSnippet());
        btn.textContent = '已复制 ✓';
        setTimeout(() => (btn.textContent = '复制'), 1600);
      } catch {
        btn.textContent = '请手动选中复制';
      }
    });
  }
}

let compareInflight = false;
async function loadCompare() {
  if (!SHOW_COMPARE) return;
  if (compareInflight) return;
  const card = $('compareCard');
  if (card && !card.dataset.done) {
    card.innerHTML = `${COMPARE_HEAD('加载中…')}
      <div class="note" style="text-align:left;padding:2px 0 14px">
        <span class="spin"></span>正在同时取 ALS 与 TRN 数据并交叉核对…</div>
      ${Array.from({ length: 3 }, () => '<div class="sk" style="height:56px;margin-bottom:10px"></div>').join('')}`;
  }
  compareInflight = true;
  try {
    const q = lastQuery ?? { name: $('name').value.trim(), platform: $('platform').value };
    const res = await fetch('/api/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      // 只取少量对局 —— 对比页关心的是「最新一场」，不需要拉很多
      body: JSON.stringify({ ...q, matches: 10, provider: 'both' }),
    });
    const j = await res.json().catch(() => null);
    if (!res.ok || !j?.ok) throw new Error(j?.error || `本地服务返回 HTTP ${res.status}`);
    renderCompare(j.compare);
    if (card) card.dataset.done = '1';
  } catch (e) {
    if (card) {
      card.innerHTML = `${COMPARE_HEAD('加载失败')}
        <pre class="errbox" style="margin:0">${esc(e.message || String(e))}</pre>`;
    }
  } finally {
    compareInflight = false;
  }
}

/** 把对局列表按传奇聚合：出场数 / 净 RP / 击杀 / 伤害 / 胜场 */
function pickStats(list) {
  const by = new Map();
  for (const m of list ?? []) {
    if (!m?.legend) continue;
    let r = by.get(m.legend);
    if (!r) by.set(m.legend, (r = { legend: m.legend, games: 0, net: 0, kills: 0, dmg: 0, wins: 0 }));
    r.games++;
    r.net += m.rpChange ?? 0;
    if (toNum(m.stats?.Wins) > 0) r.wins++;
    // 必须精确匹配 Kills —— 否则 "Career Kills" 会被算进本场击杀
    for (const [k, v] of Object.entries(m.stats ?? {})) {
      if (k === 'Kills') r.kills += toNum(v);
      else if (/damage/i.test(k)) r.dmg += toNum(v);
    }
  }
  // 出场多的排前面；并列时看净 RP，再并列看名称（保证顺序稳定）
  return [...by.values()].sort((a, b) =>
    b.games - a.games || b.net - a.net || legendCN(a.legend).localeCompare(legendCN(b.legend), 'zh'));
}

function renderPicks(list) {
  if (!SHOW_PICKS) return;
  const card = $('picksCard');
  if (!card) return;

  // list === null 表示对局数据还没回来（缓存里没有）
  if (list == null) {
    card.innerHTML = `${picksHead('加载中…')}
      <div class="note" style="text-align:left;padding:2px 0 14px">
        <span class="spin"></span>正在等对局数据…</div>
      ${Array.from({ length: 4 }, () => '<div class="sk" style="height:54px;margin-bottom:10px"></div>').join('')}`;
    return;
  }

  const rows = pickStats(list);
  if (!rows.length) {
    card.innerHTML = `${picksHead('—')}<div class="note">这段时间的对局里没有可统计的传奇数据。</div>`;
    return;
  }

  const total = rows.reduce((s, r) => s + r.games, 0);
  const max = rows[0].games;
  const top = rows[0];

  const body = rows.map((r, i) => {
    const share = Math.round((r.games / total) * 100);
    const meta = [
      r.kills ? `击杀 ${fmt(r.kills)}` : '',
      r.dmg ? `伤害 ${fmt(r.dmg)}` : '',
      r.wins ? `胜 ${r.wins}` : '',
    ].filter(Boolean).join(' · ');
    const avg = Math.round(r.net / r.games);
    const img = legendImg(r.legend);
    return `<div class="pick-row${i === 0 ? ' is-main' : ''}">
      <div class="av-wrap">
        <div class="av-f">${legendInitial(r.legend)}</div>
        ${img ? `<img class="av" src="${img}" alt="" loading="lazy" onerror="this.remove()">` : ''}
      </div>
      <div>
        <div class="nm"><span class="i">${i + 1}.</span><span class="t" title="${esc(r.legend)}">${esc(legendCN(r.legend))}</span>${i === 0 ? '<span class="badge-main">主力</span>' : ''}</div>
        <div class="meter" style="max-width:260px"><i style="width:${Math.max(4, Math.round((r.games / max) * 100))}%"></i></div>
        <div class="mt">${esc(meta) || '—'}</div>
      </div>
      <div class="ct">
        <div class="v">${r.games}</div>
        <div class="k">${share}% 出场</div>
      </div>
      <div class="rp">
        <div class="v ${trendCls(r.net)}">${fmtSigned(r.net)}</div>
        <div class="k">场均 ${fmtSigned(avg)}</div>
      </div>
    </div>`;
  }).join('');

  card.innerHTML = `${picksHead(`${total} 个会话 · ${rows.length} 个传奇`)}
    <div class="pick-sum">
      <div><div class="k">总场次</div><div class="v">${total}</div></div>
      <div><div class="k">使用过的传奇</div><div class="v">${rows.length}</div></div>
      <div><div class="k">主力传奇</div><div class="v" title="${esc(top.legend)}">${esc(legendCN(top.legend))} <small>${Math.round((top.games / total) * 100)}%</small></div></div>
    </div>
    ${body}`;
}

/* 卡片是异步填充的，渲染时按需插入到 #result 末尾 */
function ensureMatchCard() {
  let el = $('matchCard');
  if (!el) {
    el = document.createElement('div');
    el.className = 'card';
    el.id = 'matchCard';
    // 挂在第一页里（#pageOverview），不要落到 #result 上
    ($('pageOverview') ?? $('result')).appendChild(el);
  }
  return el;
}

/* ── 排位 / 匹配 ──
   后端（track.mjs）已算好 `playlist`：
     ALS 逐场：`ranked`（有 RP） / `pubs`（无 RP）—— **确定**，因为 Apex 只有排位才给 RP
     TRN 会话：`ranked`（RP 变动非 0） / `unknown`（RP 变动为 0，无法区分「匹配」与「净 0 的排位」）
   ⚠️ 不要把 `unknown` 说成「匹配」—— 那是统计推断（35/87），不是确定结论。 */
const PLAYLIST = {
  ranked: { label: '排位', cls: 'ranked' },
  pubs: { label: '匹配', cls: 'pubs' },
  unknown: { label: '未定', cls: 'unknown', title: 'RP 未变动，无法区分「匹配」与「净变化为 0 的排位」' },
};

/** 行内的排位/匹配徽标 */
function playlistBadge(p) {
  const def = PLAYLIST[p];
  if (!def) return '';
  return `<span class="badge-pl ${def.cls}"${def.title ? ` title="${esc(def.title)}"` : ''}>${def.label}</span>`;
}

/** 当前筛选：'all' | 'ranked' | 'pubs'（'pubs' 含未定） */
let matchFilter = 'all';
/* 赛季筛选：null = 全部；否则只看该赛季号。
   与走势图的 trendSeason 同构：
   · seasonFilter        —— 当前选中
   · seasonFilterTouched —— 用户是否手动点过；没点过则跟跟最新赛季 */
let seasonFilter = null;
let seasonFilterTouched = false;

/** 一条记录是否属于当前筛选 */
function passFilter(p) {
  if (matchFilter === 'all') return true;
  if (matchFilter === 'ranked') return p === 'ranked';
  // 「匹配」视图把未定也包含进来（否则那些行会两个视图都看不到）
  return p === 'pubs' || p === 'unknown' || p == null;
}

/** 是否属于当前赛季筛选 */
const passSeason = (m) => seasonFilter == null || m.season === seasonFilter;

function matchRow(m) {
  const img = legendImg(m.legend);
  const rk = rankImg(m.rank);
  const chg = m.rpChange;
  const cls = chg == null ? 'na' : chg > 0 ? 'up' : 'dn';
  const chgTxt = chg == null ? '—' : chg > 0 ? `+${chg}` : String(chg);
  const win = Number(m.stats?.Wins ?? 0) > 0;
  /* 时间放最上面（与 TRN 行一致）；下面一行放模式/地图/时长 */
  const when = whenLabel(m.timestamp) || (m.when ? `<div class="when"><b>${esc(m.when)}</b></div>` : '');
  const meta = [m.mode, m.map, m.duration].filter(Boolean).map(esc).join(' · ');
  const pairs = matchStats(m.stats);
  // 没有追踪数据的场次给一个占位符，否则中间列会完全空白、网格看着断裂
  const ks = pairs.length
    ? pairs.map(([k, v]) => `<span><span class="k">${esc(k)}</span><b>${esc(v)}</b></span>`).join('')
    : '<span><span class="k">追踪数据</span><b>—</b></span>';
  return `<div class="mrow${m.playlist === 'ranked' ? ' is-ranked' : ''}">
    <div class="av-wrap">
      <div class="av-f">${legendInitial(m.legend)}</div>
      ${img ? `<img class="av" src="${img}" alt="" loading="lazy" onerror="this.remove()">` : ''}
    </div>
    <div>
      ${when}
      <div class="nm" title="${esc(m.legend ?? '')}">${esc(legendCN(m.legend) ?? '—')}${playlistBadge(m.playlist)}${win ? '<span class="badge-win">胜</span>' : ''}</div>
      <div class="meta">${meta || '—'}</div>
    </div>
    <div class="ks${pairs.length ? '' : ' na'}">${ks}</div>
    <div class="rp">
      <div class="chg ${cls}">${chgTxt}</div>
      <div class="rpv">${rk ? `<img src="${rk}" alt="" onerror="this.remove()">` : ''}${m.rp != null ? `${fmt(m.rp)} RP` : ''}</div>
    </div>
    ${matchExtra(m)}
  </div>`;
}

/* 按「赛季 + 会话」分组 —— 同一时段连打的几局放一起，和 ALS 自己的口径一致 */
function groupMatches(list) {
  const groups = [];
  for (const m of list) {
    const k = `${m.split ?? '?'}|${m.session ?? 0}`;
    let g = groups.find((x) => x.k === k);
    if (!g) groups.push((g = { k, split: m.split, list: [] }));
    g.list.push(m);
  }
  return groups;
}

/* 按赛季分组（赛季号降序，新的在前）。
   split 可能跨上下半段，所以收集成集合，展示时再压缩成「第 1 段」或「第 1–2 段」。 */
function groupBySeason(list) {
  const by = new Map();
  for (const m of list) {
    const k = m.season ?? 0;
    let g = by.get(k);
    if (!g) {
      by.set(k, (g = {
        season: m.season ?? null,
        name: m.seasonName ?? null,
        start: m.seasonStart ?? null,
        splits: new Set(),
        list: [],
      }));
    }
    if (m.seasonSplit) g.splits.add(m.seasonSplit);
    g.list.push(m);
  }
  for (const g of by.values()) {
    g.split = [...g.splits].sort((a, b) => a - b).join('–') || null;
    // 组内按时间降序，保证最新在前
    g.list.sort((a, b) => (b.timestamp ?? 0) - (a.timestamp ?? 0));
  }
  return [...by.values()].sort((a, b) => (b.season ?? 0) - (a.season ?? 0));
}

const seasonGroupsCount = (list) => new Set(list.map((x) => x.season ?? 0)).size;

/* TRN 的**会话行**。与 ALS 的逐场行必须区分开：
   它的 kills/damage 是「这一段时间的合计」，不是单场 —— 直接当逐场显示会误导。
   所以加「会话」徽标 + 单独的列（N 场），并去掉地图/时长（TRN 没有）。

   段位：TRN 提供 `rankScoreInfo`（名 + 徽章图 + 主题色），
   但**只有 match 级有**（83/87），缺失时退回不带图的文字段位。 */
function trnRow(s) {
  const img = legendImg(s.legend);
  const chg = s.rpChange;
  const cls = chg == null ? 'na' : chg > 0 ? 'up' : 'dn';
  const chgTxt = chg == null ? '—' : chg > 0 ? `+${chg}` : String(chg);
  /* 时间放**最上面**（对齐 tracker.gg 的 "1 day ago" 作为行标签），
     比埋在灰色 meta 里显眼得多 —— 用户反馈过「看不到对局时间」。 */
  const when = whenLabel(s.timestamp, s.matchCount > 1 ? `${s.matchCount} 场` : '');
  const ks = [
    s.kills != null ? ['击杀', fmt(s.kills)] : null,
    s.damage != null ? ['伤害', fmt(s.damage)] : null,
  ].filter(Boolean)
    .map(([k, v]) => `<span><span class="k">${esc(k)}</span><b>${esc(v)}</b></span>`).join('');

  /* 段位：优先用 TRN 给的 CDN 徽章图；没有图就只显示段位名。
     图片用 tracker.gg 的 trackercdn（已在导出白名单里，且是公开资源）。 */
  const rankName = s.rankName
    ? String(s.rankName).replace(/(\d+)\s*$/, (m, n) => ['', 'I', 'II', 'III', 'IV'][n] ?? m)
    : null;
  const rankBadge = s.rankImg
    ? `<img src="${esc(s.rankImg)}" alt="${esc(rankName ?? '')}" onerror="this.remove()">`
    : '';

  return `<div class="mrow trn${s.playlist === 'ranked' ? ' is-ranked' : ''}">
    <div class="av-wrap">
      <div class="av-f">${legendInitial(s.legend)}</div>
      ${img ? `<img class="av" src="${img}" alt="" loading="lazy" onerror="this.remove()">` : ''}
    </div>
    <div>
      ${when}
      <div class="nm" title="${esc(s.legend ?? '')}">${esc(legendCN(s.legend) ?? '—')}<span class="badge-sess">会话</span>${playlistBadge(s.playlist)}</div>
    </div>
    <div class="ks${ks ? '' : ' na'}">${ks || '<span><span class="k">统计</span><b>—</b></span>'}</div>
    <div class="rp">
      <div class="chg ${cls}">${chgTxt}</div>
      <div class="rpv">${rankBadge}${s.rp != null ? `${fmt(s.rp)} RP` : ''}${
        rankName ? `<span class="rk">${esc(rankName)}</span>` : ''}</div>
    </div>
  </div>`;
}

function renderMatches(pack) {
  if (!SHOW_MATCHES) return;
  const card = ensureMatchCard();

  const rawAls = pack?.als ?? [];
  const rawTrn = pack?.trn ?? [];
  /* 本项目只用 tracker.gg，所以 ALS 用不上（保留变量以便回退时使用）。 */
  const alsAll = [];

  /* TRN 全部保留（alsAll 恒为空 → alsNewest = 0）。 */
  const trnAll = rawTrn
    .slice()
    .sort((a, b) => (b.timestamp ?? 0) - (a.timestamp ?? 0));

  if (!alsAll.length && !trnAll.length) {
    card.innerHTML = `${matchHead('—')}<div class="note">还没有 tracker.gg 的对局数据。
      <br>到「<b>数据对比</b>」页签按指引做一次浏览器采集即可。</div>`;
    return;
  }

  /* ── 排位/匹配统计与筛选 ── */
  const all = [...trnAll, ...alsAll];

  /* 赛季筛选：只列出真正有数据的赛季（降序） */
  const seasonsPresent = [...new Set(trnAll.map((m) => m.season).filter((x) => x != null))]
    .sort((a, b) => b - a);
  const latestSeason = seasonsPresent[0] ?? null;

  /* ── 当前赛季（后端按系统日期算出，不是从对局数据反推）──
     玩家可能一段时间没打，数据最新赛季很可能**落后于**当前赛季，
     这时必须说清楚，否则用户会以为「赛季按钮里没有当前赛季」是 bug。
     单独占一行：塞进筛选条的 flex 行里会被挤压截断（试过）。 */
  const cs = curSeasonInfo?.season ?? null;
  const csStale = curSeasonInfo?.stale === true;              // 内置赛季表已过期
  const csInconsistent = curSeasonInfo?.consistent === false; // 与 tracker.gg 不一致
  const dataBehind = cs != null && latestSeason != null && latestSeason < cs;

  const csNote = cs == null ? '' : `<div class="season-now">
    <span class="cs" title="按当前日期判断，与 tracker.gg 的 currentSeason 交叉验证">
      当前赛季 <b>S${cs}</b>${curSeasonInfo.name ? ` · ${esc(curSeasonInfo.name)}` : ''}${
        curSeasonInfo.split ? ` · 第 ${curSeasonInfo.split} 段` : ''}
    </span>
    ${dataBehind
      ? `<span class="cs warn" title="数据里的最新赛季早于当前赛季；按「数据对比」页的指引重新采集即可拿到新赛季">⚠️ 数据最新只到 S${latestSeason}</span>`
      : ''}
    ${csInconsistent
      ? `<span class="cs warn" title="两边的当前赛季不一致，说明内置赛季表需要更新">⚠️ 与 tracker.gg 不一致（对方报 S${curSeasonInfo.trackerSays}），请更新 SEASONS</span>`
      : ''}
    ${csStale
      ? `<span class="cs warn" title="当前日期已超出内置赛季表的覆盖范围">⚠️ 赛季表可能已过期，请更新 SEASONS</span>`
      : ''}
  </div>`;

  /* ⚠️ **默认只看最新赛季**：87 个会话跨 5 个赛季、页面高 7000+px，
     一次全铺出来很难看（用户在走势图处也提过同样需求）。
     与走势图一致的「默认跟随 + 手动锁定」：
       if (!touched && 当前值不是最新) 跟随最新；
     这样既满足「默认最新」，又不会在重新查询后把用户的选择弄丢、
     或停在已不存在的赛季上。 */
  if (!seasonFilterTouched && seasonFilter !== latestSeason) seasonFilter = latestSeason;

  /* 类型统计（排位/匹配）按**当前赛季**算，否则按钮上的数字与实际显示不符 */
  const inSeason = trnAll.filter(passSeason);
  const cnt = { ranked: 0, pubs: 0, unknown: 0 };
  inSeason.forEach((x) => { if (cnt[x.playlist] != null) cnt[x.playlist]++; });
  // 类型筛选 + 赛季筛选同时生效
  const shownAls = alsAll.filter((m) => passFilter(m.playlist) && passSeason(m));
  const shownTrn = inSeason.filter((s) => passFilter(s.playlist));

  const fbtn = (v, label, n) =>
    `<button class="tbtn${matchFilter === v ? ' on' : ''}" data-pl="${v}">${label}${
      n == null ? '' : ` ${n}`}</button>`;
  const seasBtn = (v, label) =>
    `<button class="tbtn${seasonFilter === v ? ' on' : ''}" data-season="${v}">${label}</button>`;

  const filterBar = `<div class="mh-filter">
    <span class="lb">类型</span>
    ${fbtn('all', '全部', inSeason.length)}
    ${fbtn('ranked', '排位', cnt.ranked)}
    ${fbtn('pubs', '匹配', cnt.pubs + cnt.unknown)}
  </div>
  ${seasonsPresent.length > 1 ? `<div class="mh-filter" style="margin-top:-6px">
    <span class="lb">赛季</span>
    <button class="tbtn${seasonFilter == null ? ' on' : ''}" data-season="">全部 ${seasonsPresent.length}</button>
    ${seasonsPresent.map((s) => {
      const n = trnAll.filter((m) => m.season === s).length;
      // 当前赛季加个小圆点标记，一眼看出「现在是这个赛季」
      return seasBtn(s, `S${s} ${n}${s === cs ? '<i class="now-dot"></i>' : ''}`);
    }).join('')}
  </div>` : ''}
  ${csNote}
  <div class="src-note" style="margin:0 0 14px">
    数据来自 <b>tracker.gg</b>（浏览器采集，无需 API Key）。
    每个「会话」是一次连续游戏的<b>合计</b>，不是单场 —— 所以没有地图与逐场时长。<br>
    排位按「RP 有变动」判定；变动为 0 时无法区分「匹配」与「净变化为 0 的排位」，故标为未定。
    赛季归属按时间戳推导（tracker.gg 不提供赛季起止时间）。
  </div>`;

  /* 筛选后为空 → 明确提示，不要留一片空白（筛选条要保留，否则用户无法切回来） */
  if (!shownAls.length && !shownTrn.length) {
    card.innerHTML = `${matchHead('—')}${filterBar}
      <div class="note">当前筛选下没有对局。换个赛季或类型试试。</div>`;
    bindMatchFilter();
    return;
  }

  /* 汇总指标：净 RP 与最常使用用**当前展示的全部记录**算（TRN + ALS）。
     （不再统计「总时长」—— tracker.gg 的会话级聚合没有时长。） */
  const shownAll = [...shownTrn, ...shownAls];
  const net = shownAll.reduce((s, m) => s + (m.rpChange ?? 0), 0);
  const picked = {};
  shownAll.forEach((m) => m.legend && (picked[m.legend] = (picked[m.legend] ?? 0) + 1));
  const top = Object.entries(picked).sort((a, b) => b[1] - a[1])[0];

  /* ── 按**赛季**分组（tracker.gg 不给赛季时间，后端的 seasonOf() 用内置赛季表推导）──
     每个组头显示：赛季号 · 主题名 · 开始日期 · 会话数 · 排位/未定分布 · 净 RP */
  const seasonGroups = groupBySeason(shownTrn).map((g) => {
    const gnet = g.list.reduce((s, m) => s + (m.rpChange ?? 0), 0);
    const gr = g.list.filter((m) => m.playlist === 'ranked').length;
    const gu = g.list.length - gr;
    const first = whenText(g.list.at(-1)); // 组内最旧
    const last = whenText(g.list[0]);       // 组内最新
    /* 组头也带上相对时间（对齐 tracker.gg 的 "Session Overview 1 day ago"），
       指「这个赛季最近一次打是多久前」—— 比绝对时间范围更直观。 */
    const rel = relTime(g.list[0]?.timestamp);
    return `<div class="mh-group">
      <div class="mh-split">
        <span class="sp">S${g.season ?? '?'}</span>
        <span>
          ${esc(g.name ?? '')}${g.start ? ` · ${esc(g.start)} 起` : ''} ·
          ${g.list.length} 个会话 · 排位 ${gr}${gu ? ` / 未定 ${gu}` : ''} ·
          净 RP ${gnet > 0 ? '+' : ''}${fmt(gnet)}
        </span>
      </div>
      <div class="mh-range" title="${esc(first)} → ${esc(last)}">${
        rel ? `<b>${esc(rel)}</b> · ` : ''}${esc(first)} → ${esc(last)}${
        g.split ? ` · 第 ${g.split} 段` : ''}</div>
      ${g.list.map(trnRow).join('')}
    </div>`;
  }).join('');

  const trnGroup = shownTrn.length ? `<div class="mh-group">
    <div class="mh-split"><span class="sp trn">TRACKER.GG</span>
      <span>${shownTrn.length} 个会话${
        seasonGroupsCount(shownTrn) > 1 ? ` · 覆盖 ${seasonGroupsCount(shownTrn)} 个赛季` : ''}</span></div>
    <div class="src-note">来自 tracker.gg（浏览器采集）。<b>每个「会话」是一次连续游戏的合计</b>，
      不是单场，也没有地图与时长。赛季归属由内置赛季表按时间戳推导
      （tracker.gg 本身不提供赛季起止时间）。</div>
    ${seasonGroups}
  </div>` : '';

  const groups = groupMatches(shownAls).map((g) => {
    const gnet = g.list.reduce((s, m) => s + (m.rpChange ?? 0), 0);
    const head = `${esc(whenText(g.list[0]))} · ${g.list.length} 场` +
      (gnet ? ` · 净 RP ${gnet > 0 ? '+' : ''}${fmt(gnet)}` : '');
    return `<div class="mh-group">
      <div class="mh-split"><span class="sp">${esc(splitLabel(g.split))}</span><span>${head}</span></div>
      ${g.list.map(matchRow).join('')}
    </div>`;
  }).join('');

  const alsGroup = shownAls.length ? `<div class="mh-group">
    <div class="mh-split"><span class="sp">ALS</span>
      <span>逐场明细 · ${shownAls.length} 场</span></div>
    ${groups}
  </div>` : '';

  const sub = (() => {
    const n = shownAls.length + shownTrn.length;
    const parts = [];
    if (seasonFilter == null) parts.push(`全部 ${seasonsPresent.length} 个赛季`);
    else parts.push(`S${seasonFilter}`);
    if (matchFilter !== 'all') parts.push(matchFilter === 'ranked' ? '仅排位' : '仅匹配');
    parts.push(`${n} 个会话`);
    return parts.join(' · ');
  })();

  card.innerHTML = `${matchHead(sub)}
    <div class="mh-sum">
      <div><div class="k">排位</div><div class="v">${cnt.ranked}</div></div>
      <div><div class="k">匹配${cnt.unknown ? ' / 未定' : ''}</div><div class="v">${cnt.pubs}${cnt.unknown ? ` / ${cnt.unknown}` : ''}</div></div>
      <div><div class="k">净 RP</div><div class="v ${net > 0 ? 'up' : net < 0 ? 'dn' : ''}">${net > 0 ? '+' : ''}${fmt(net)}</div></div>
      ${seasonFilter == null && seasonsPresent.length ? `<div><div class="k">赛季</div><div class="v">${seasonsPresent.length}<small>个</small></div></div>` : ''}
      ${top ? `<div><div class="k">最常使用</div><div class="v" title="${esc(top[0])}">${esc(legendCN(top[0]))} <small>${top[1]} ${shownTrn.length && !shownAls.length ? '个会话' : '场'}</small></div></div>` : ''}
    </div>
    ${filterBar}
    ${trnGroup}${alsGroup}`;
  bindMatchFilter();
}

/* 类型/赛季筛选：只重渲染卡片，不重新请求 */
function bindMatchFilter() {
  document.querySelectorAll('#matchCard .mh-filter .tbtn').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (btn.dataset.season !== undefined) {
        const v = btn.dataset.season;
        seasonFilter = v === '' ? null : Number(v);
        seasonFilterTouched = true; // 手动选过之后就不再自动跟随最新
      } else {
        matchFilter = btn.dataset.pl;
      }
      const pack = matchCache.get(qKey(lastQuery ?? {}));
      if (pack) renderMatches(pack);
    });
  });
}


/* TRN 会话 → 近似 ALS 逐场的形状，供走势图 / 常用传奇兜底。
   ⚠️ 只是**字段形状**适配，语义仍是会话级聚合（kills 是时段合计），
     所以这两处视图只在 ALS 没数据时才用它。 */
function trnAsMatches(list) {
  return (list ?? []).map((s) => ({
    ...s,
    stats: {
      ...(s.kills != null ? { Kills: String(s.kills) } : {}),
      ...(s.damage != null ? { Damage: String(s.damage) } : {}),
      ...(s.wins != null ? { Wins: String(s.wins) } : {}),
    },
  }));
}

/** 逐场数据：优先 ALS；ALS 为空时用 TRN 会话兜底（保证走势图/常用传奇不空） */
const perMatch = (pack) => (pack?.als?.length ? pack.als : trnAsMatches(pack?.trn));

function renderPackage(pack) {
  renderTrend(perMatch(pack));
  renderMatches(pack);
  renderPicks(perMatch(pack));
}

async function loadMatches({ auto = false } = {}) {
  if (!NEED_MATCHES()) return;
  // 页签点击（auto=false）但还没有查询结果 → 给个明确提示，别静默无反应
  if (!lastQuery || !SHOW_MATCHES) {
    if (!auto && SHOW_MATCHES) {
      const card = ensureMatchCard();
      card.innerHTML = `${matchHead('等待查询')}
        <div class="note" style="text-align:left;padding:2px 0 14px">
          先执行一次查询，这里会显示对局记录。</div>`;
      card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    return;
  }
  const key = qKey(lastQuery);

  // 高亮已由 goto() 的 setActive 处理，这里不再动页签
  const cached = matchCache.get(key);
  if (cached) {
    renderPackage(cached);
    if (!auto && SHOW_MATCHES) $('matchCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  if (matchInflight.has(key)) return; // 同一个玩家只发一次
  matchInflight.add(key);

  if (SHOW_MATCHES) {
    const card = ensureMatchCard();
    card.innerHTML = `${matchHead('加载中…')}
      <div class="note" style="text-align:left;padding:2px 0 16px">
        <span class="spin"></span>正在按赛季回溯对局记录…</div>
      ${Array.from({ length: 6 }, () => '<div class="sk" style="height:38px;margin-bottom:9px"></div>').join('')}`;
    // 自动加载不抢滚动位置（本次查询结束后页面本来就要回到顶部，会打架）
    if (!auto) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* 请求期间用户可能已经换了玩家：条件对不上就丢弃结果，
     否则会把上一个玩家的对局画到新查询的页面上 */
  const stale = () => qKey(lastQuery ?? {}) !== key;

  try {
    // provider:'both' —— 同时取 ALS 逐场与 TRN 会话，
    // 这样对局记录里既能看明细、又能看到最新的那批。
    const res = await fetchJson('/api/query', {
      ...lastQuery, provider: 'trn',
    });
    const j = await res.json().catch(() => null);
    if (!res.ok || !j?.ok) throw new Error(j?.error || `本地服务返回 HTTP ${res.status}`);
    const pack = { als: j.matches ?? [], trn: j.trnSessions ?? [] };
    matchCache.set(key, pack); // 结果本身有效，即使已切换玩家也照常入缓存
    if (!stale()) renderPackage(pack);
  } catch (e) {
    if (!stale()) {
      const box = `<pre class="errbox" style="margin:0">${esc(e.message || String(e))}</pre>`;
      if (SHOW_MATCHES) ensureMatchCard().innerHTML = `${matchHead('加载失败')}${box}`;
      const tc = $('trendCard');
      if (SHOW_TREND && tc) tc.innerHTML = `${trendHead('加载失败')}${box}`;
      const pc = $('picksCard');
      if (SHOW_PICKS && pc) pc.innerHTML = `${picksHead('加载失败')}${box}`;
    }
  } finally {
    matchInflight.delete(key);
    buildTabs();
  }
}

/* ── 查询 ── */
async function doQuery() {
  const uid = $('uid').value.trim();
  const name = $('name').value.trim();
  const platform = $('platform').value;

  $('errbox').innerHTML = '';
  if (!uid && !name) { showError('请填写 UID 或玩家名'); return; }

  const btn = $('go');
  btn.disabled = true;
  setStatus('', '查询中…');
  $('hint').textContent = '';
  $('result').classList.remove('on');
  $('skeleton').classList.add('on');

  /* 换人了：先撤掉上一个玩家的对局卡片，并把页签复位到 Overview，
     否则查询期间点到「对局记录」会拿旧条件去请求、或残留旧卡片。
     筛选状态也一并复位 —— 上个玩家选中的赛季在新玩家身上可能根本不存在。 */
  $('matchCard')?.remove();
  lastQuery = null;
  seasonFilter = null;
  seasonFilterTouched = false; // 回到「自动跟随最新赛季」
  trendSeason = null;
  trendSeasonTouched = false; // 回到「自动跟随最新赛季」
  showPage('overview'); // 切回第一页，顺带丢掉「常用传奇」页里的旧数据
  setActive('top');
  buildTabs();

  /* 查询条件写进 URL，刷新和分享都能复现；用 replaceState 免得每次查询都塞一条历史 */
  const qs = new URLSearchParams(uid ? { uid, platform } : { name, platform });
  try {
    history.replaceState(null, '', '?' + qs);
    localStorage.setItem('apex:last', '?' + qs);
  } catch {}

  try {
    const res = await fetch('/api/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      // 与 loadMatches 一致：加超时，避免上游不通时界面无限等待
      body: JSON.stringify({ uid, name, platform }),
      signal: AbortSignal.timeout(FETCH_TIMEOUT_MS),
    });
    if (!res.ok) throw new Error(`本地服务返回 HTTP ${res.status} ${res.statusText}`);
    const j = await res.json();
    if (!j.ok) {
      showError(j.error || '查询失败');
      setStatus('err', '查询失败');
      return;
    }
    // 记下条件（对局页签要用同一套 uid/name/platform 再查一次）
    lastQuery = { uid, name, platform };
    curSeasonInfo = j.record?.seasonInfo ?? null;
    render(j);
    setStatus('ok', '查询成功');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    const raw = e.message || String(e);
    /* 区分「服务没起」和「查询本身失败」，前者给出可操作的提示 */
    const msg = /Failed to fetch|NetworkError|load failed|fetch/i.test(raw)
      ? `连不上本地服务。请确认 server.mjs 正在运行：\n\n    cd ${location.pathname.replace(/\/$/, '') || '.'}\n    node server.mjs\n\n（${raw}）`
      : raw;
    showError(msg);
    setStatus('err', /HTTP 5/.test(raw) ? '服务异常' : '连接失败');
  } finally {
    btn.disabled = false;
    $('skeleton').classList.remove('on');
  }
}

function showError(msg) {
  $('errbox').innerHTML = `<pre class="errbox">${esc(msg)}</pre>`;
}

function setStatus(kind, text) {
  const el = $('status');
  el.className = kind;
  el.textContent = text;
}

/* ── 页签：完全由下面这张注册表生成 ──
   关键：**不渲染**（而不是渲染成禁用态）—— 之前用 `disabled` + 降透明度，
   页面上会留下点不动的灰按钮，看着像功能坏了。 */
const TABS = [
  { id: 'tabTop', target: 'top', label: 'Overview', show: () => true },
  { id: 'tabPicks', target: 'picks', label: '常用传奇', show: () => SHOW_PICKS },
  { id: 'tabCompare', target: 'compare', label: '数据对比', show: () => SHOW_COMPARE,
    title: 'ALS 与 TRN 两源交叉对比（走 --provider both，TRN 需 API Key）' },
  { id: 'tabLegend', target: 'legendCard', label: 'Legends', show: () => SHOW_LEGENDS },
  { id: 'tabRank', target: 'rankCard', label: '排行', show: () => SHOW_RANK },
  { id: 'tabMatch', target: 'matchCard', label: '对局记录', show: () => SHOW_MATCHES,
    title: '查询时已自动加载（额外 2~4 个请求）' },
];

/* 当前高亮的落点（'top' / 'picks' / 区块 id） */
let activeTab = 'top';

/* 该页签此刻是否值得出现：
   flag 开着，且目标确实存在。
   legendCard / rankCard 依赖数据（没有段位击杀就根本不会生成），
   所以必须看 DOM；picks / matchCard 则是固定页面，有 flag 就够。 */
function tabReady(t) {
  if (!t.show()) return false;
  if (t.target === 'top') return true;
  if (t.target === 'picks') return SHOW_PICKS;
  if (t.target === 'compare') return SHOW_COMPARE;
  if (t.target === 'matchCard') return SHOW_MATCHES;
  return Boolean(document.getElementById(t.target));
}

function setActive(target) {
  activeTab = target;
  TABS.forEach((t) => $(t.id)?.classList.toggle('on', t.target === target));
}

/* 重建页签。render() / loadMatches() 后都要调一次：
   数据变了可能有区块消失（如某玩家没有带击杀的传奇），
   对应的页签要跟着收起，而不是留一个点了没反应的按钮。 */
function buildTabs() {
  const nav = $('tabs');
  if (!nav) return;
  const items = TABS.filter(tabReady);
  // 原来高亮的页签已不存在时，回落到第一个可用项
  if (!items.some((t) => t.target === activeTab)) activeTab = items[0]?.target ?? 'top';
  nav.innerHTML = items
    .map((t) => `<button id="${t.id}"${t.title ? ` title="${esc(t.title)}"` : ''}>${esc(t.label)}</button>`)
    .join('');
  items.forEach((t) => $(t.id).addEventListener('click', () => goto(t.target)));
  setActive(activeTab);
}

function goto(target) {
  setActive(target);
  // 「常用传奇」/「数据对比」是独立页面：切页 + 回到顶部
  if (target === 'picks' || target === 'compare') {
    showPage(target);
    // 对比页要额外拉 TRN（限流），所以只在进来时按需加载
    if (target === 'compare') loadCompare();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  showPage('overview');
  // 对局卡片是懒加载的：点它就是「去加载」（已加载则只是滚过去）
  if (target === 'matchCard') { loadMatches(); return; }
  const el = target === 'top' ? document.body : document.getElementById(target);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

$('go').addEventListener('click', doQuery);
['uid', 'name'].forEach((id) => $(id).addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); doQuery(); }
}));

// 首帧先建页签（此时还没有数据，只会有 Overview）
buildTabs();

/* ── 初始化：URL 参数 > 上次查询 > 默认 bluekinger ── */
(function init() {
  const p = new URLSearchParams(location.search);
  let uid = p.get('uid') || '';
  let name = p.get('name') || '';
  let platform = p.get('platform') || '';

  if (!uid && !name) {
    try {
      const last = new URLSearchParams(localStorage.getItem('apex:last') || '');
      uid = last.get('uid') || '';
      name = last.get('name') || '';
      platform = platform || last.get('platform') || '';
    } catch {}
  }
  if (!uid && !name) name = 'bluekinger';

  $('uid').value = uid;
  $('name').value = name;
  if (platform) $('platform').value = platform;

  doQuery();
})();
</script>
</body>
</html>
